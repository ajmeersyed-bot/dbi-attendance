<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DBI Attendance</title>

  <style>
    :root {
      --navy:#1F3864;
      --bg:#F4F6FA;
      --card:#fff;
      --muted:#6B7280;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:#111;
    }

    header {
      background:var(--navy);
      color:#fff;
      padding:14px 16px;
    }

    header h1 {
      margin:0;
      font-size:17px;
    }

    header .sub {
      font-size:12px;
      opacity:.85;
      margin-top:2px;
    }

    .wrap {
      padding:14px;
      max-width:560px;
      margin:0 auto;
    }

    .card {
      background:#fff;
      border-radius:12px;
      padding:14px;
      margin-bottom:12px;
      box-shadow:0 1px 3px rgba(0,0,0,.08);
    }

    label {
      font-size:13px;
      color:var(--muted);
      display:block;
      margin:10px 0 6px;
    }

    select,
    input {
      width:100%;
      font-size:17px;
      padding:12px;
      border:1px solid #CBD5E1;
      border-radius:10px;
      background:#fff;
    }

    input.pin {
      letter-spacing:10px;
      text-align:center;
      font-size:24px;
    }

    button {
      width:100%;
      font-size:16px;
      font-weight:600;
      padding:14px;
      border:0;
      border-radius:10px;
      cursor:pointer;
      margin-top:12px;
    }

    .primary {
      background:var(--navy);
      color:#fff;
    }

    .err {
      color:#C00000;
      font-weight:600;
      margin-top:10px;
    }
  </style>
</head>

<body>

<header>
  <h1>DBI Attendance</h1>
  <div class="sub">Digital Bridge International</div>
</header>

<div class="wrap">

  <div class="card">

    <label>Your name</label>

    <select id="fName">
      <option value="">Select your name</option>
    </select>

    <label>4-digit PIN</label>

    <input
      id="fPin"
      class="pin"
      type="password"
      inputmode="numeric"
      maxlength="4"
      autocomplete="off"
    >

    <button class="primary" onclick="doLogin()">
      Log in
    </button>

    <div id="eLogin" class="err"></div>

  </div>

</div>

<script>

const API_URL = "/api/backend";

async function callBackend(action, data = {}) {

 const response = await fetch(API_URL, {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    action: action,
    args: data
  })
});

  if (!response.ok) {
    throw new Error("Server error: " + response.status);
  }

  const result = await response.json();

  if (!result.success) {
    throw new Error(result.error || "Something went wrong.");
  }

  return result.data;
}


// Load faculty names
async function loadNames() {

  try {

    const names = await callBackend("getFacultyNames");

    const select = document.getElementById("fName");

    select.innerHTML =
      '<option value="">Select your name</option>';

    names.forEach(function(name) {

      const option = document.createElement("option");

      option.value = name;
      option.textContent = name;

      select.appendChild(option);

    });

  } catch (error) {

    document.getElementById("eLogin").textContent =
      error.message;

  }

}


// Login
async function doLogin() {

  const name =
    document.getElementById("fName").value;

  const pin =
    document.getElementById("fPin").value.trim();

  document.getElementById("eLogin").textContent = "";

  if (!name) {

    document.getElementById("eLogin").textContent =
      "Select your name.";

    return;
  }

  if (!/^\d{4}$/.test(pin)) {

    document.getElementById("eLogin").textContent =
      "Enter your 4-digit PIN.";

    return;
  }

  try {

    const result = await callBackend("login", {
      name: name,
      pin: pin
    });

    console.log("Login successful:", result);

    alert("Login successful for " + result.name);

  } catch (error) {

    document.getElementById("eLogin").textContent =
      error.message;

  }

}


// Start
loadNames();

</script>

</body>
</html>
